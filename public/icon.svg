<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="ball" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="60%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
    <radialGradient id="ballGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#bef264" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#84cc16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="courtBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Subtle Tennis Court Lines in Background -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="6" fill="none">
    <rect x="76" y="76" width="360" height="360" rx="16" />
    <line x1="76" y1="256" x2="436" y2="256" stroke-width="8" />
    <line x1="256" y1="76" x2="256" y2="436" stroke-dasharray="16,8" />
    <line x1="140" y1="76" x2="140" y2="436" />
    <line x1="372" y1="76" x2="372" y2="436" />
  </g>

  <!-- Golden/Cyan Accent Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#courtBorder)" stroke-width="6" opacity="0.8" />

  <!-- Tennis Ball Base with Shadow -->
  <circle cx="256" cy="256" r="140" fill="url(#ball)" filter="url(#shadow)" />
  
  <!-- Tennis Ball Seams (Curved White Lines) -->
  <path d="M 170 144 C 230 190 230 322 170 368" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9" />
  <path d="M 342 144 C 282 190 282 322 342 368" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9" />

  <!-- Ball Specular Highlight Glow -->
  <ellipse cx="206" cy="206" rx="46" ry="34" fill="url(#ballGlow)" transform="rotate(-30 206 206)" />

  <!-- Small ATP/WTA Trophy Badge at corner -->
  <g transform="translate(340, 340) scale(0.65)" filter="url(#shadow)">
    <circle cx="64" cy="64" r="60" fill="#0f172a" stroke="#38bdf8" stroke-width="6" />
    <!-- Mini Racket & Stars -->
    <path d="M 64 30 L 64 76 M 52 94 L 76 94 M 64 76 L 64 100" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" fill="none" />
    <ellipse cx="64" cy="48" rx="20" ry="24" fill="none" stroke="#f59e0b" stroke-width="6" />
  </g>
</svg>
