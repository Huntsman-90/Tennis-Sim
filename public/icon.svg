<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="50%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Tennis Ball Base -->
  <circle cx="256" cy="256" r="140" fill="url(#ballGrad)" filter="url(#glow)"/>
  
  <!-- Tennis Ball Seams -->
  <path d="M 170 145 C 230 190, 230 322, 170 367" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.95"/>
  <path d="M 342 145 C 282 190, 282 322, 342 367" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.95"/>

  <!-- Center Trophy Icon Badge -->
  <circle cx="256" cy="256" r="48" fill="#0f172a" fill-opacity="0.85" stroke="#fbbf24" stroke-width="4"/>
  <path d="M 240 236 L 272 236 L 272 248 C 272 258, 264 266, 256 266 C 248 266, 240 258, 240 248 Z" fill="#fbbf24"/>
  <path d="M 236 240 L 230 240 C 226 240, 226 250, 232 252 L 240 252" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M 276 240 L 282 240 C 286 240, 286 250, 280 252 L 272 252" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M 252 266 L 252 274 L 244 278 L 268 278 L 260 274 L 260 266" fill="#fbbf24"/>
</svg>
